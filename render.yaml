services:
  - type: web
    name: arena-kanoa-reservas
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /saude
    domains:
      - reservas.arenakanoa.com.br
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: arena-kanoa-db
          property: connectionString
      - key: BASE_URL
        value: https://reservas.arenakanoa.com.br
      - key: SITE_ORIGIN
        value: https://arenakanoa.com.br
      - key: SESSION_SECRET
        generateValue: true
      - key: EXPORT_TOKEN
        generateValue: true
      - key: ADMIN_USER
        value: Guilherme
      - key: ADMIN_PASSWORD
        sync: false
      - key: PIX_CHAVE
        sync: false
      - key: PIX_NOME
        value: Arena Kanoa
      - key: PIX_CIDADE
        value: Sete Quedas
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false

databases:
  - name: arena-kanoa-db
    region: virginia
    plan: free
    databaseName: arena
